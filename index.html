<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #fff;
      color: #111;
    }

    .inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 20px;
      box-sizing: border-box;
    }

    header {
      border-bottom: 1px solid #eee;
    }

    header .inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
      padding: 0;
      margin: 0;
    }

    nav a {
      text-decoration: none;
      color: #111;
      font-weight: 500;
    }

    /* Hero Section */
    #hero {
      background: #ffffff;
      text-align: center;
      padding: 80px 20px 40px;
    }

    #hero h2 {
      font-size: 2.5rem;
      margin-bottom: 16px;
    }

    #hero .hero-subtitle {
      font-size: 1.1rem;
      color: #555;
      line-height: 1.6;
      max-width: 600px;
      margin: 0 auto 24px;
    }

    .hero-preview-video {
      margin-top: 24px;
      display: flex;
      justify-content: center;
    }

    .hero-preview-video a {
      display: block;
      width: 40%;
      max-width: 720px;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
    }

    .hero-preview-video video {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      display: block;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .hero-preview-video a:hover video {
      opacity: 0.85;
    }

    .video-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .hero-preview-video a:hover .video-overlay {
      opacity: 1;
    }

    .video-overlay span {
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 24px;
      letter-spacing: 0.03em;
    }

    #contact-info .inner {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }

    footer {
      text-align: center;
      padding: 20px 0;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <h1><a href="index.html" class="site-logo" style="text-decoration:none; color:#111;">My Portfolio</a></h1>
      <nav>
        <ul>
          <li><a href="portfolio.html">Portfolio</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Hero Section -->
  <section id="hero">
    <div class="inner">
      <h2>My Portfolio</h2>
      <p class="hero-subtitle">안녕하세요! 경성대학교 미디어콘텐츠학과에 재학 중인 정민주입니다⭐️<br>
      저에 대해서 여러분들에게 소개합니다</p>
      <div class="hero-preview-video">
        <a href="portfolio.html">
          <video src="preview.mp4" autoplay muted loop playsinline></video>
          <div class="video-overlay">
            <span>📁 포트폴리오 보기</span>
          </div>
        </a>
      </div>
    </div>
  </section>

  <!-- 연락처 -->
  <section id="contact-info">
    <div class="inner">
      <p>📧 jmj040308@gmail.com  |  📸 @mzoo</p>
    </div>
  </section>

  <footer>
    <div class="inner">
      &copy; 2025 My Portfolio
    </div>
  </footer>
</body>
</html>
